name: AI Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Groq model ID
        required: true
        default: openai/gpt-oss-120b
        type: string
      call_delay_ms:
        description: Delay between evaluation calls in milliseconds
        required: true
        default: '500'
        type: string

permissions:
  contents: read

concurrency:
  group: ai-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Run AI evaluation suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GROQ_MODEL: ${{ inputs.model }}
      AI_EVAL_CALL_DELAY_MS: ${{ inputs.call_delay_ms }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate evaluation secrets
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Repository secret GROQ_API_KEY is required."
            exit 1
          fi
          if [ -z "$COHERE_API_KEY" ]; then
            echo "::error::Repository secret COHERE_API_KEY is required."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run AI evaluations
        run: ./gradlew --no-daemon aiEval

      - name: Publish scorecards
        if: always()
        run: |
          if [ ! -d build/reports/ai-eval ]; then
            echo "No AI evaluation reports were generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS= read -r report; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          done < <(find build/reports/ai-eval -name report.md -type f | sort)

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-${{ github.run_number }}
          path: build/reports/ai-eval/
          if-no-files-found: warn
          retention-days: 30
