name: CI

# Run tests on every push to any branch and on PRs targeting main.
# The build-and-upload job only fires on push to main (or manual dispatch)
# and only after tests pass.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon build -x test

      - name: Test (unit + Testcontainers integration)
        run: ./gradlew --no-daemon test
        # GitHub Actions ships a modern Docker daemon, so the API-version
        # override in build.gradle.kts is harmless here. Testcontainers
        # picks up the runner's Docker automatically.

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  build-and-upload:
    name: Build + upload backend to S3
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # id-token: write is required for actions/configure-aws-credentials
      # to mint the short-lived OIDC JWT presented to AWS STS. Scoped to
      # this job (not the workflow) so the test job can't accidentally
      # acquire AWS credentials.
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::799093034139:role/eunomia-github-deployer
      DEPLOY_BUCKET: eunomia-deploys-799093034139
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build bootJar
        run: ./gradlew --no-daemon bootJar -x test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Locate built JAR
        id: jar
        run: |
          # bootJar produces eunomia-compliance-engine-<version>.jar; the
          # plain jar (-plain.jar) is excluded.
          JAR_PATH=$(ls build/libs/*.jar | grep -v -- '-plain' | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::No JAR found in build/libs/"
            ls -la build/libs/
            exit 1
          fi
          echo "Found: $JAR_PATH ($(du -h "$JAR_PATH" | cut -f1))"
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to S3
        run: |
          SHA="${{ github.sha }}"
          JAR_PATH="${{ steps.jar.outputs.path }}"
          aws s3 cp "$JAR_PATH" "s3://${DEPLOY_BUCKET}/backend/app-${SHA}.jar"
          aws s3 cp "$JAR_PATH" "s3://${DEPLOY_BUCKET}/backend/latest.jar"
          echo ""
          echo "Uploaded:"
          echo "  s3://${DEPLOY_BUCKET}/backend/app-${SHA}.jar"
          echo "  s3://${DEPLOY_BUCKET}/backend/latest.jar"
          echo ""
          echo "Recent objects in bucket:"
          aws s3 ls "s3://${DEPLOY_BUCKET}/backend/" --human-readable | tail -5

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          EC2_INSTANCE_ID: i-01fd2669d11cda33d
        run: |
          # The deploy script runs as root on EC2 via SSM. It pulls the
          # freshly-uploaded JAR from S3, atomically swaps it in, restarts
          # the systemd unit, and rolls back to app.jar.prev if
          # /actuator/health doesn't return UP within 120 seconds.
          cat > /tmp/deploy.sh <<'DEPLOY_EOF'
          #!/bin/bash
          set -e
          BUCKET="eunomia-deploys-799093034139"
          APP_DIR="/home/ec2-user"
          APP_JAR="$APP_DIR/app.jar"
          NEW_JAR="$APP_DIR/app.jar.new"
          PREV_JAR="$APP_DIR/app.jar.prev"
          SERVICE="eunomia"
          HEALTH_URL="http://localhost:8080/actuator/health"

          echo "[deploy] downloading latest.jar from S3"
          aws s3 cp "s3://${BUCKET}/backend/latest.jar" "$NEW_JAR"

          if [ ! -s "$NEW_JAR" ]; then
            echo "[deploy] ERROR: downloaded JAR is empty"
            exit 1
          fi

          if [ -f "$APP_JAR" ]; then
            echo "[deploy] backing up current JAR -> app.jar.prev"
            cp "$APP_JAR" "$PREV_JAR"
          fi

          chown ec2-user:ec2-user "$NEW_JAR"
          mv "$NEW_JAR" "$APP_JAR"
          echo "[deploy] swapped in new JAR"

          systemctl restart "$SERVICE"
          echo "[deploy] systemctl restart $SERVICE issued"

          for i in $(seq 1 24); do
            sleep 5
            if curl -fsS --max-time 5 "$HEALTH_URL" >/dev/null 2>&1; then
              echo "[deploy] SUCCESS - health UP at attempt $i (~$((i*5))s)"
              exit 0
            fi
            echo "[deploy] attempt $i/24: not yet healthy"
          done

          echo "[deploy] FAILED - health did not return UP within 120s"
          if [ -f "$PREV_JAR" ]; then
            echo "[deploy] rolling back to previous JAR"
            mv "$PREV_JAR" "$APP_JAR"
            systemctl restart "$SERVICE"
            exit 2
          fi
          exit 3
          DEPLOY_EOF

          # aws ssm send-command --parameters expects {"commands":["..."]}.
          # jq -Rs reads the whole script as one string and wraps it.
          PARAMS=$(jq -Rs '{commands: [.]}' < /tmp/deploy.sh)

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "instance_id=$EC2_INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy + print EC2 output
        env:
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
          INSTANCE_ID: ${{ steps.ssm.outputs.instance_id }}
        run: |
          # Poll SSM until terminal status. Cap at 5 minutes; the deploy
          # script itself caps at ~120s plus restart overhead.
          STATUS=Pending
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "$INSTANCE_ID" \
              --command-id "$CMD_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "[poll] $i/60: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo ""
          echo "=== EC2 stdout ==="
          aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$CMD_ID" \
            --query 'StandardOutputContent' \
            --output text

          echo ""
          echo "=== EC2 stderr ==="
          aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$CMD_ID" \
            --query 'StandardErrorContent' \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy failed with status: $STATUS"
            exit 1
          fi
          echo "Deploy succeeded."
