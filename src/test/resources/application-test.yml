eunomia:
  security:
    jwt:
      # Test-only signing key. Deterministic and meaningless outside tests.
      secret: dGVzdC1zZWNyZXQtc28tbG9uZy10aGF0LWl0LWlzLW1vcmUtdGhhbi0yNTYtYml0cy1sb25nLXh4eHg=
      expiry-seconds: 3600
      issuer: eunomia-test
  storage:
    local:
      # Tests write tiny blobs into a JVM-tmp folder; the OS cleans up.
      root: ${java.io.tmpdir}/eunomia-test-storage
  mapper:
    # The production default throttles between Mapper calls to stay
    # under Groq's free-tier TPM cap. Tests use a stub model with no
    # rate limit and don't want sleep wasting CI time.
    call-delay-ms: 0
