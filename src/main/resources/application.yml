spring:
  application:
    name: eunomia
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/eunomia}
    username: ${DATABASE_USERNAME:eunomia}
    password: ${DATABASE_PASSWORD:eunomia}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

eunomia:
  llm:
    groq:
      # Groq's REST surface is OpenAI-compatible; we point LangChain4j's
      # OpenAI adapter at this base URL and authenticate with a Groq key.
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      temperature: ${GROQ_TEMPERATURE:0.1}
      timeout-seconds: ${GROQ_TIMEOUT:60}
    cohere:
      # Cohere embed-english-v3.0 produces 1024-d L2-normalised vectors.
      # Free tier is generous enough for the capstone.
      api-key: ${COHERE_API_KEY:}
      model: ${COHERE_MODEL:embed-english-v3.0}
      timeout-seconds: ${COHERE_TIMEOUT:60}
  security:
    jwt:
      # 64+ char random string. Generate with: openssl rand -base64 64
      # No default — the app refuses to boot without it.
      secret: ${JWT_SECRET}
      expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}
      issuer: ${JWT_ISSUER:eunomia}
  mapper:
    # ANN top-K — how many candidate policy chunks per obligation the
    # judge sees. Higher = more thorough, more LLM tokens.
    top-k: ${MAPPER_TOP_K:5}
    # LLM judge confidence below this → not a match. Above → persisted.
    confidence-threshold: ${MAPPER_CONFIDENCE_THRESHOLD:0.6}
  storage:
    local:
      # Sprint 1 stores uploaded blobs on the local filesystem. Container
      # restarts on Render wipe this; that's acceptable for the capstone
      # — re-upload during demos. Production would swap in an S3-backed
      # StorageService bean.
      root: ${STORAGE_ROOT:./data}

# Allow PDF uploads up to ~25MB (CBK circulars are usually under 10MB).
servlet:
  multipart:
    max-file-size: 25MB
    max-request-size: 25MB

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
    io.kalunge.eunomia: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%12.12thread]){faint} %clr(%-32.32logger{32}){cyan} %msg%n"
