spring:
  application:
    name: eunomia
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/eunomia}
    username: ${DATABASE_USERNAME:eunomia}
    password: ${DATABASE_PASSWORD:eunomia}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

eunomia:
  security:
    jwt:
      # 64+ char random string. Generate with: openssl rand -base64 64
      # No default — the app refuses to boot without it.
      secret: ${JWT_SECRET}
      expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}
      issuer: ${JWT_ISSUER:eunomia}
  storage:
    local:
      # Sprint 1 stores uploaded blobs on the local filesystem. Container
      # restarts on Render wipe this; that's acceptable for the capstone
      # — re-upload during demos. Production would swap in an S3-backed
      # StorageService bean.
      root: ${STORAGE_ROOT:./data}

# Allow PDF uploads up to ~25MB (CBK circulars are usually under 10MB).
servlet:
  multipart:
    max-file-size: 25MB
    max-request-size: 25MB

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
    io.kalunge.eunomia: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
