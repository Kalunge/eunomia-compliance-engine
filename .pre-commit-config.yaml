# Pre-commit hooks for Eunomia.
# Install once: `pip install pre-commit && pre-commit install`
# Run on all files: `pre-commit run --all-files`

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # Kotlin formatting + linting via ktlint. Installs the binary on first run.
  - repo: https://github.com/JLLeitschuh/ktlint-gradle
    rev: v12.1.1
    hooks:
      - id: ktlint
        name: ktlint
        files: \.(kt|kts)$
        # Stays opt-in until ktlint plugin is wired into build.gradle.kts.
        stages: [manual]

  # Secret scanning before anything reaches GitHub.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(\.gradle/|build/|node_modules/|gradle/wrapper/gradle-wrapper\.jar)
